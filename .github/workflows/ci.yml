name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore discordbot.sln

      - name: Build
        run: dotnet build discordbot.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test discordbot.sln --configuration Release --no-build --logger trx
